<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769d2">
<title>ЗСК · Нет сети</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 72% 12%,#dceaff 0,transparent 34%),linear-gradient(180deg,#fff,#eef5ff);color:#0b2b55;font-family:Inter,Arial,sans-serif}
.card{width:min(560px,100%);padding:34px;border:1px solid rgba(23,105,210,.2);background:rgba(255,255,255,.96);box-shadow:0 24px 70px rgba(31,76,136,.14)}
.mark{width:64px;height:64px;display:grid;place-items:center;border:1px solid #1769d2;background:#1769d2;color:#fff;font-weight:900;margin-bottom:28px}
h1{font-size:clamp(2.6rem,10vw,5rem);line-height:.92;letter-spacing:-.06em;margin:0 0 18px}
p{color:#60758f;line-height:1.6}
.status{display:flex;align-items:center;gap:9px;margin:26px 0;color:#1769d2;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
.status i{width:8px;height:8px;border-radius:50%;background:#1769d2;box-shadow:0 0 16px rgba(23,105,210,.35)}
button{min-height:48px;padding:0 20px;background:#1769d2;border:0;color:#fff;font-weight:800;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="card">
 <div class="mark">ЗСК</div>
 <h1>Нет подключения к сети</h1>
 <p>Некоторые ранее открытые страницы и файлы могут оставаться доступными. Когда соединение появится, сайт автоматически снова будет работать в обычном режиме.</p>
 <div class="status"><i></i> PWA / offline mode</div>
 <button onclick="location.reload()">Повторить</button>
</div>
</body>
</html>
